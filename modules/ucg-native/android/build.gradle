plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.usedcarguys'
version = '0.1.0'

android {
  namespace "expo.modules.ucgnative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Google ML Kit text recognition, model bundled in the app: free, and
  // works offline. Nothing leaves the phone.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap');
    :root{
      --navy:#273368; --navy-dark:#1B2450; --navy-tint:#E7EAF5;
      --red:#C33531; --red-dark:#A32A27; --red-tint:#FBEAEA;
      --bg:#F7F7FB; --card:#FFFFFF; --text:#20263F; --text-muted:#6B7280; --border:#E7E7EE;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:#EDEEF3;}
    .phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;}
    .display{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;}
    .navbar{padding:18px 20px 4px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
    .circbtn{width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .field{margin-bottom:16px;}
    .field label{font-size:12.5px;font-weight:700;color:var(--text-muted);letter-spacing:0.3px;text-transform:uppercase;}
    .input{margin-top:7px;height:50px;border:1.5px solid var(--border);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:14.5px;color:#B9BDC9;}
    .seg{display:flex;gap:8px;margin-top:7px;}
    .segopt{flex:1;height:44px;border-radius:11px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--text-muted);}
    .segopt.active{background:var(--navy);border-color:var(--navy);color:#fff;}
    .phototile{width:76px;height:76px;border-radius:12px;border:1.5px dashed #C9CDD9;background:#fff;display:flex;align-items:center;justify-content:center;}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:19px;cursor:pointer;border:none;width:100%;}
    .btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(195,53,49,0.30);}
    .trust{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  </style>
</helmet>

<div class="phone">
  <div class="navbar">
    <div class="circbtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#273368" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <div class="display" style="font-size:19px;color:var(--text);">Sell It Back</div>
  </div>

  <div style="flex:1;overflow:hidden;padding:14px 22px 0;">
    <div style="font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-bottom:20px;">
      Already own a Used Car Guys vehicle? Get a real offer in minutes &mdash; no obligation.
    </div>

    <div class="field">
      <label>License Plate or VIN</label>
      <div class="input">e.g. 1HGCM82633A004352</div>
    </div>

    <div class="field">
      <label>Current Mileage</label>
      <div class="input">e.g. 41,200 miles</div>
    </div>

    <div class="field">
      <label>Overall Condition</label>
      <div class="seg">
        <div class="segopt">Fair</div>
        <div class="segopt active">Good</div>
        <div class="segopt">Excellent</div>
      </div>
    </div>

    <div class="field">
      <label>Add Photos</label>
      <div style="display:flex;gap:10px;margin-top:7px;">
        <div class="phototile">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C33531" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="phototile">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9CDD9" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>
        </div>
        <div class="phototile">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9CDD9" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink:0;padding:8px 22px 22px;">
    <div class="btn btn-primary">Get My Offer</div>
    <div style="display:flex;margin-top:20px;padding:0 4px;">
      <div class="trust">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#273368" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/></svg>
        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-align:center;">No obligation</div>
      </div>
      <div class="trust">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#273368" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-align:center;">Real offers, real fast</div>
      </div>
      <div class="trust">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#273368" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);text-align:center;">We come to you</div>
      </div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>

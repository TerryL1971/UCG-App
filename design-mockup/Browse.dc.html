<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap');
    :root{
      --navy:#273368; --navy-dark:#1B2450; --navy-tint:#E7EAF5;
      --red:#C33531; --red-dark:#A32A27; --red-tint:#FBEAEA;
      --bg:#F7F7FB; --card:#FFFFFF; --text:#20263F; --text-muted:#6B7280; --border:#E7E7EE;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:#EDEEF3;}
    .phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;}
    .display{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;}
    .navbar{background:#fff;padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
    .iconbtn{width:44px;height:44px;border-radius:12px;background:var(--navy-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .chip{padding:9px 16px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1.5px solid var(--border);color:var(--text);}
    .chip.active{background:var(--red);border-color:var(--red);color:#fff;}
    .card{background:var(--card);border-radius:18px;box-shadow:0 6px 18px rgba(39,51,104,0.08);overflow:hidden;}
    .tabbar{height:80px;background:var(--navy);display:flex;align-items:flex-start;padding-top:12px;justify-content:space-around;flex-shrink:0;}
    .tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;}
    .tab.active{color:#fff;}
    .tab-ic{width:38px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
    .tab.active .tab-ic{background:var(--red);}
  </style>
</helmet>

<div class="phone">
  <div class="navbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="ucg-icon.png" style="height:22px;width:auto;">
      <div class="display" style="font-size:20px;color:var(--text);">Browse Inventory</div>
    </div>
    <div class="iconbtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#273368" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="14" cy="7" r="2.4" fill="#273368" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="17" r="2.4" fill="#273368" stroke="none"/></svg>
    </div>
  </div>

  <div style="padding:16px 20px 10px;flex-shrink:0;">
    <div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0B4" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <span style="color:#9AA0B4;font-size:14.5px;">Search make, model, or type</span>
    </div>
  </div>

  <div style="display:flex;gap:10px;padding:8px 20px 14px;flex-shrink:0;">
    <div class="chip active">All</div>
    <div class="chip">SUV</div>
    <div class="chip">Sedan</div>
    <div class="chip">Under $20k</div>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 20px;display:flex;flex-direction:column;gap:16px;">

    <div class="card">
      <div style="height:150px;background:linear-gradient(180deg,#DCE2F2,#C9D2EC);position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="220" height="100" viewBox="0 0 220 100">
          <path d="M14 76 L26 44 Q34 30 54 30 L150 30 Q170 30 178 44 L190 76 Z" fill="#273368"/>
          <rect x="16" y="70" width="188" height="18" rx="9" fill="#20263F"/>
          <circle cx="62" cy="88" r="14" fill="#141A47"/><circle cx="62" cy="88" r="5.5" fill="#AEB6CE"/>
          <circle cx="158" cy="88" r="14" fill="#141A47"/><circle cx="158" cy="88" r="5.5" fill="#AEB6CE"/>
          <rect x="42" y="38" width="24" height="14" rx="2" fill="#B9C6E8"/>
          <rect x="146" y="38" width="24" height="14" rx="2" fill="#B9C6E8"/>
        </svg>
        <div style="position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C33531" stroke-width="2.2"><path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 9.5 7C19 16.65 12 21 12 21z"/></svg>
        </div>
      </div>
      <div style="padding:14px 16px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="font-weight:700;font-size:15.5px;color:var(--text);">2021 Toyota RAV4 XLE</div>
          <div class="display" style="font-size:19px;color:var(--red);">$24,995</div>
        </div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">32,410 mi &middot; Automatic &middot; Stuttgart Lot</div>
      </div>
    </div>

    <div class="card">
      <div style="height:150px;background:linear-gradient(180deg,#F3DEDD,#EBC9C7);position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="220" height="100" viewBox="0 0 220 100">
          <path d="M20 78 L36 40 Q46 28 66 28 L154 28 Q174 28 184 40 L200 78 Z" fill="#C33531"/>
          <rect x="16" y="72" width="188" height="18" rx="9" fill="#8C2624"/>
          <circle cx="64" cy="90" r="14" fill="#141A47"/><circle cx="64" cy="90" r="5.5" fill="#AEB6CE"/>
          <circle cx="160" cy="90" r="14" fill="#141A47"/><circle cx="160" cy="90" r="5.5" fill="#AEB6CE"/>
          <rect x="52" y="36" width="26" height="14" rx="2" fill="#F3D2D0"/>
          <rect x="142" y="36" width="26" height="14" rx="2" fill="#F3D2D0"/>
        </svg>
        <div style="position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA0B4" stroke-width="2.2"><path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 9.5 7C19 16.65 12 21 12 21z"/></svg>
        </div>
      </div>
      <div style="padding:14px 16px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="font-weight:700;font-size:15.5px;color:var(--text);">2020 Honda Civic Sport</div>
          <div class="display" style="font-size:19px;color:var(--red);">$18,450</div>
        </div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">27,880 mi &middot; Automatic &middot; Stuttgart Lot</div>
      </div>
    </div>

  </div>

  <div class="tabbar">
    <div class="tab active">
      <div class="tab-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></div>
      <div>Browse</div>
    </div>
    <div class="tab">
      <div class="tab-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 9.5 7C19 16.65 12 21 12 21z"/></svg></div>
      <div>Saved</div>
    </div>
    <div class="tab">
      <div class="tab-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/></svg></div>
      <div>My Deal</div>
    </div>
    <div class="tab">
      <div class="tab-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg></div>
      <div>Account</div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
